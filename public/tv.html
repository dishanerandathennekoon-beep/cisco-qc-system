<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CISCO QC - Ultra Visibility TV Board</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-black: #030712;
      --card-bg: #0b1329;
      --border-bright: #1e293b;
      --neon-blue: #00f0ff;
      --neon-green: #00ff66;
      --neon-yellow: #ffcc00;
      --neon-red: #ff3366;
      --text-white: #ffffff;
      --text-dim: #94a3b8;
    }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
    }

    .dashboard-header {
      background: #0b1329;
      border: 2px solid #0284c7;
      border-radius: 14px;
      padding: 8px 18px;
      margin-bottom: 8px;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.3);
      flex-shrink: 0;
    }

    .main-title { font-size: 1.5rem; font-weight: 900; color: #ffffff; }

    .live-beacon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 51, 102, 0.2);
      color: #ff6688;
      border: 2px solid var(--neon-red);
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 0.85rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: var(--neon-red);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--neon-red);
      animation: beaconPulse 1.2s infinite alternate;
    }

    @keyframes beaconPulse {
      0% { transform: scale(0.8); box-shadow: 0 0 4px var(--neon-red); }
      100% { transform: scale(1.3); box-shadow: 0 0 16px var(--neon-red); }
    }

    .senior-qc-badge {
      background: rgba(0, 240, 255, 0.12);
      border: 1.5px solid var(--neon-blue);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 8px;
    }

    .senior-qc-name { color: var(--neon-blue); font-weight: 900; }

    .shift-badge-header {
      background: rgba(255, 204, 0, 0.15);
      border: 1.5px solid var(--neon-yellow);
      color: var(--neon-yellow);
      font-size: 0.9rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 8px;
    }

    .clock-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--neon-blue);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .qc-table-container {
      flex: 1;
      background: var(--card-bg);
      border: 2px solid var(--border-bright);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .qc-table { width: 100%; height: 100%; margin: 0; border-collapse: separate; border-spacing: 0; }
    .qc-table thead th { background: #1e293b; color: var(--neon-yellow); font-size: 0.9rem; font-weight: 900; text-transform: uppercase; padding: 10px 8px; border-bottom: 2px solid #334155; text-align: center; white-space: nowrap; }
    .qc-table tbody tr { background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s ease; }
    .qc-table tbody tr.row-active { background: rgba(0, 240, 255, 0.08); border-left: 5px solid var(--neon-green); }
    .qc-table tbody tr.row-idle { opacity: 0.5; }
    .qc-table td { padding: 4px 8px; font-size: 1.05rem; font-weight: 700; color: #ffffff; text-align: center; vertical-align: middle; white-space: nowrap; }

    .machine-badge { font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 800; padding: 2px 10px; border-radius: 6px; display: inline-block; background: rgba(0, 240, 255, 0.15); color: var(--neon-blue); border: 1.5px solid var(--neon-blue); }
    .product-text { color: #ffffff; font-weight: 800; font-size: 1.05rem; }
    .batch-text { color: var(--neon-yellow); font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 800; }
    .weight-glow { font-family: 'JetBrains Mono', monospace; font-weight: 800; color: var(--neon-green); font-size: 1.25rem; text-shadow: 0 0 10px rgba(0, 255, 102, 0.4); }
    .time-text { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--text-dim); }

    /* Live Ticker Marquee Bar */
    .ticker-bar {
      display: none;
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--neon-yellow);
      border-radius: 10px;
      padding: 6px 14px;
      margin-top: 8px;
      font-weight: 800;
      color: var(--neon-yellow);
      font-size: 1rem;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
    }

    .fullscreen-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-dim); font-size: 0.85rem; font-weight: 700; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    .fullscreen-btn:hover { background: rgba(0, 240, 255, 0.2); border-color: var(--neon-blue); color: var(--neon-blue); }

    @media (max-width: 768px) {
      html, body { height: auto !important; max-height: none !important; overflow-y: auto !important; }
      .qc-table-container { overflow-x: auto; }
      .qc-table td { padding: 10px 8px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <div class="dashboard-header d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="d-flex align-items-center gap-3">
      <span class="live-beacon"><span class="pulse-dot"></span> LIVE QC BOARD</span>
      <div>
        <h3 class="m-0 main-title">CISCO SPECIALITY PACKAGING</h3>
        <div class="d-flex align-items-center gap-2 mt-1 flex-wrap">
          <span class="text-secondary small fw-bold">Plant: <strong id="currentPlantTitle" class="text-info">Plant 01</strong></span>
          <span class="shift-badge-header" id="currentShiftBadge"><i class="bi bi-clock-history me-1"></i>Shift: Shift 01</span>
          <span class="senior-qc-badge"><i class="bi bi-person-badge-fill me-1"></i>Senior QC: <strong id="currentLeaderBadge" class="senior-qc-name">Mr. Mangala</strong></span>
        </div>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <select id="plantSelect" class="form-select bg-dark text-white border-info fw-bold fs-6" onchange="changePlantFilter(this.value)">
        <option value="all">🏢 All Plants View</option>
        <option value="Plant 1">🏭 Plant 01 Display</option>
        <option value="Husky">🏭 Husky Display</option>
        <option value="Plant 4">🏭 Plant 04 Display</option>
        <option value="Plant 05">🏭 Plant 05 Display</option>
        <option value="BCM">🏭 B.C.M. Display</option>
      </select>

      <div class="text-end ms-2">
        <div id="clock" class="clock-display" style="font-size: 1.6rem;">00:00:00</div>
      </div>

      <button class="fullscreen-btn ms-2" onclick="toggleFullScreen()" title="Full Screen Mode">
        <i class="bi bi-arrows-fullscreen"></i>
      </button>
    </div>
  </div>

  <!-- Single Unified Table Container -->
  <div class="qc-table-container">
    <table class="qc-table">
      <thead>
        <tr>
          <th>Machine</th>
          <th>Product Name</th>
          <th>Batch No</th>
          <th>Bag Size</th>
          <th>Packing</th>
          <th>Colour</th>
          <th>Weight</th>
          <th>Line QC</th>
          <th>Last Update</th>
        </tr>
      </thead>
      <tbody id="tvTableBody">
        <tr>
          <td colspan="9" class="py-5 text-center text-muted fs-5">
            <div class="spinner-border text-info mb-2" role="status"></div>
            <div>Loading Plant Machine Matrix...</div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Ticker Broadcast Banner -->
  <div class="ticker-bar" id="tickerBar">
    <marquee id="tickerText" behavior="scroll" direction="left" scrollamount="8"></marquee>
  </div>

  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    const plantMachineDatabase = {
      'Plant 1': ['Santo 01', 'Santo 02', 'Santo 03', 'Haitian 01', 'Haitian 02', 'Haitian 03', 'Haitian 04', 'Haitian 05', 'Haitian 06', 'CML 01', 'CML 02', 'CML 03', 'CML 04', 'CML 05', 'CML 06', 'EM 128', 'EM 168', 'JM 128'],
      'Husky': ['Husky 01', 'Husky 02', 'Husky 03'],
      'Plant 4': ['Synergy 01', 'Friend 01', 'Friend 02', 'Friend 03', 'Chum Power 01', 'Chum Power 02', 'Chum Power 03'],
      'Plant 05': ['Synergy 02', 'Manual 01', 'Manual 02', 'Manual 03', 'Manual 04', 'E.B.M.', 'Friend 04', 'Friend 05', 'Friend 06', 'Friend 07', 'Santo 04', 'Santo 05'],
      'BCM': ['BCM 01', 'BCM 02']
    };

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

    const urlParams = new URLSearchParams(window.location.search);
    let selectedPlant = urlParams.get('plant') || 'Plant 1';
    document.getElementById('plantSelect').value = selectedPlant;

    function changePlantFilter(newPlant) {
      selectedPlant = newPlant;
      document.getElementById('currentPlantTitle').innerText = selectedPlant === 'all' ? 'All Plants' : selectedPlant;
      fetchTVData();
    }

    function normalizePlantName(p) {
      if (!p) return 'Plant 1';
      if (p === 'Plant 5') return 'Plant 05';
      return p;
    }

    async function fetchTVData() {
      try {
        // Fetch Active Shift & Senior QC Directly
        const shiftRes = await fetch('/api/active-shift');
        const activeShift = await shiftRes.json();
        if (activeShift) {
          document.getElementById('currentShiftBadge').innerHTML = `<i class="bi bi-clock-history me-1"></i>Shift: ${activeShift.shift_name || 'Shift 01'}`;
          document.getElementById('currentLeaderBadge').innerText = activeShift.shift_leader || 'Mr. Mangala';
        }

        // Fetch Live Broadcast Announcement
        const bRes = await fetch('/api/broadcast');
        const broadcast = await bRes.json();
        const tickerBar = document.getElementById('tickerBar');
        const tickerText = document.getElementById('tickerText');

        if (broadcast && broadcast.message && broadcast.message.trim() !== '') {
          tickerText.innerText = broadcast.message;
          tickerBar.style.display = 'block';
        } else {
          tickerBar.style.display = 'none';
        }

        // Fetch Live Machine Records
        const res = await fetch(`/api/latest-per-machine?plant=${encodeURIComponent(selectedPlant)}`);
        const records = await res.json();
        
        document.getElementById('currentPlantTitle').innerText = selectedPlant === 'all' ? 'All Plants' : selectedPlant;
        
        const recordMap = {};
        records.forEach(r => { recordMap[r.machine_name.trim().toLowerCase()] = r; });

        let targetMachines = [];
        if (selectedPlant === 'all') {
          Object.keys(plantMachineDatabase).forEach(p => {
            targetMachines.push(...plantMachineDatabase[p].map(m => ({ machine: m, plant: p })));
          });
        } else {
          const normPlant = normalizePlantName(selectedPlant);
          const predefined = plantMachineDatabase[normPlant] || plantMachineDatabase['Plant 1'] || [];
          const customFromDb = records.filter(r => normalizePlantName(r.plant_name) === normPlant).map(r => r.machine_name).filter(m => !predefined.includes(m));
          targetMachines = [...predefined, ...customFromDb].map(m => ({ machine: m, plant: normPlant }));
        }

        const tbody = document.getElementById('tvTableBody');
        tbody.innerHTML = targetMachines.map(item => {
          const mName = item.machine;
          const rowData = recordMap[mName.trim().toLowerCase()];

          if (rowData) {
            return `
              <tr class="row-active">
                <td><span class="machine-badge">${rowData.machine_name}</span></td>
                <td class="product-text">${rowData.product_name}</td>
                <td class="batch-text">${rowData.batch_number}</td>
                <td>${rowData.bag_size || '-'}</td>
                <td>${rowData.packing_size || '-'}</td>
                <td>${rowData.product_colour || '-'}</td>
                <td class="weight-glow">${rowData.weight_grams}g</td>
                <td>${rowData.qc_inspector}</td>
                <td class="time-text">${new Date(rowData.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
              </tr>
            `;
          } else {
            return `
              <tr class="row-idle">
                <td><span class="machine-badge opacity-50">${mName}</span></td>
                <td colspan="8" class="text-secondary italic">Awaiting Inspection Input</td>
              </tr>
            `;
          }
        }).join('');

      } catch (err) {
        console.error("Error fetching live TV data:", err);
      }
    }

    fetchTVData();
    setInterval(fetchTVData, 3000);
  </script>
</body>
</html>
